name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates: GitHub merges
# the PR itself once the checks the `main` ruleset requires (CI's `test` and
# `image`) pass. Major updates wait for a human.
#
# A merge made with the GITHUB_TOKEN starts no new workflow run, so it
# publishes no image by itself: the next push to main, or CI's weekly
# rebuild, does.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'sgrimee/ham-trainer-lu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
