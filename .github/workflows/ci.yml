name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The German course's setting for the next deployment (specs/LEARN-DE.md
    # §2.2): `preview` while it is being translated, `on` from its release.
    env:
      COURSE_DE: preview
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Lint and type check
        run: mise run lint

      - name: Unit tests
        run: mise run test

      - name: Extraction round trip + curated annotations
        run: mise run verify
