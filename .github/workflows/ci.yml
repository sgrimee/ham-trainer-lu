name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The German course's setting for the next deployment (specs/LEARN-DE.md
    # §2.2): `preview` while it is being translated, `on` from its release.
    env:
      COURSE_DE: preview
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Lint and type check
        run: mise run lint

      - name: Unit tests
        run: mise run test

      - name: Extraction round trip + curated annotations
        run: mise run verify

  # Same image and tags as `mise run docker-publish`, on every push to main
  # that passes the tests. Needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # repository secrets (a Docker Hub access token with write scope).
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sgrimee/examen-ilr:latest
            sgrimee/examen-ilr:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub page's text comes from DOCKERHUB.md. Unlike the push,
      # this needs the token's read/write/delete scope.
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sgrimee/examen-ilr
          readme-filepath: ./DOCKERHUB.md
          short-description: Web trainer for the Luxembourg ILR amateur-radio exam (BASE, NOVICE, HAREC)
