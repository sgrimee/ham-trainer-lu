name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Lint and type check
        run: mise run lint

      - name: Unit tests
        run: mise run test

      - name: Extraction round trip + curated annotations
        run: mise run verify
