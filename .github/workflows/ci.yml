name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild from a fresh base image, so Debian and Python security fixes
  # reach the published image even when the code doesn't change.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Least privilege by default; a job that needs more says so.
permissions:
  contents: read

# Every action is pinned to a commit, not a tag: a tag can be moved, and the
# image job hands these actions the Docker Hub token. Dependabot bumps the
# commit and the version comment together.
jobs:
  test:
    runs-on: ubuntu-latest
    # The German course's setting for the next deployment (specs/LEARN-DE.md
    # §2.2): `preview` while it is being translated, `on` from its release.
    env:
      COURSE_DE: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: mise run setup

      - name: Lint and type check
        run: mise run lint

      - name: Unit tests
        run: mise run test

      - name: Extraction round trip + curated annotations
        run: mise run verify

  # Builds the image and scans it with Docker Scout (the same scanner Docker
  # Hub shows). A critical or high CVE that has a fix fails the job before
  # anything is pushed; the full report goes to the repository's Security tab.
  # On main (push, the weekly schedule or a manual run) the image is then
  # pushed with the same tags as `mise run docker-publish`. Needs the
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets (a Docker Hub
  # access token with write scope), so it skips pull requests from forks.
  image:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The scheduled rebuild skips the layer cache, so `apt-get upgrade`
      # really runs again instead of replaying last week's layer.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: examen-ilr:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Full vulnerability report
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with:
          command: cves
          image: local://examen-ilr:scan
          sarif-file: scout.sarif
          vex-location: .vex
          vex-author: ".*<sgrimee@users.noreply.github.com>"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('scout.sarif') != ''
        with:
          sarif_file: scout.sarif
          category: docker-scout

      - name: Fail on fixable critical or high CVEs
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with:
          command: cves
          image: local://examen-ilr:scan
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          vex-location: .vex
          vex-author: ".*<sgrimee@users.noreply.github.com>"

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            sgrimee/examen-ilr:latest
            sgrimee/examen-ilr:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's Scout view reads exceptions only from attestations (the
      # image has provenance, so a VEX file in the filesystem would be
      # ignored). .vex/ records the CVEs that don't affect this image and why.
      # The CLI is a pinned release checked against its known digest, not an
      # install script fetched from a branch, as this step holds the push login.
      - name: Attach VEX exceptions
        if: env.PUBLISH == 'true'
        env:
          SCOUT_VERSION: 1.24.0
          SCOUT_SHA256: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b
        run: |
          tarball="docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/${tarball}"
          echo "${SCOUT_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p ~/.docker/cli-plugins
          tar -xzf "$tarball" -C ~/.docker/cli-plugins docker-scout
          chmod +x ~/.docker/cli-plugins/docker-scout
          for tag in latest ${{ steps.sha.outputs.short }}; do
            docker scout attestation add \
              --file .vex/examen-ilr.vex.json \
              --predicate-type https://openvex.dev/ns/v0.2.0 \
              sgrimee/examen-ilr:$tag
          done

      # The Docker Hub page's text comes from DOCKERHUB.md. Unlike the push,
      # this needs the token's read/write/delete scope.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: sgrimee/examen-ilr
          readme-filepath: ./DOCKERHUB.md
          short-description: Web trainer for the Luxembourg ILR amateur-radio exam (BASE, NOVICE, HAREC)
