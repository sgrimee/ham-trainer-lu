# The BASE course: parts, modules, steps and the one concept graph
# (specs/LEARN.md §3, specs/LEARN-2-3.md §2-3).
#
# The only place `introduces` / `requires` live; lesson files never repeat them.
# Order is the course order: parts, modules and steps top to bottom. Part 3
# comes before part 2 on purpose (LEARN-2-3 §2.2): part 2 assumes the UIT, the
# certificates and the callsign. A part's number comes from app/catalogue.py's
# PART_NAMES, never from this file. Every part's practice steps are exactly the
# BASE questions of its catalogue section.
# `uv run python -m app.course` validates it; `--report` helps review it.
