449:
  1:  # QSY?
    - text: "Devez-vous changer de fréquence de transmission ?"
      source: ilr-guide-2023 p.20 §4.5
    - lang: de
      text: "Sollen Sie die Sendefrequenz wechseln?"
      source: decision 2026-09-27
  2:  # QSA
    - text: "La force de vos signaux est S (1-9)."
      source: ilr-guide-2023 p.19 §4.5
  3:  # QRN
    - text: "Je suis troublé par des parasites atmosphériques."
      source: ilr-guide-2023 p.19 §4.5
    - note: "« Je suis brouillé » est le sens de QRM dans le même tableau du guide, pas celui de QRN : donner le sens de QRM pour QRN est une réponse fausse, ni présente ni near."
      source: ilr-guide-2023 p.19 §4.5
    - lang: de
      text: "Ich werde durch atmosphärische Störungen beeinträchtigt."
      source: decision 2026-09-27
    - lang: de
      note: "„Parasiten“ im deutschen Katalog ist eine wörtliche Übersetzung des französischen « parasites », das Störungen (Rauschen, Gewitter) bedeutet, keine Lebewesen. Störungen oder atmosphärische Störungen sind das Element, vorhanden und nicht near. „Ich werde gestört“ ist die Bedeutung von QRM, nicht von QRN: eine falsche Antwort, weder vorhanden noch near."
      source: decision 2026-09-27
  4:  # QRO
    - text: "Augmentez la puissance d'émission."
      source: ilr-guide-2023 p.19 §4.5

451:
  3:  # R
    - text: "Received"
      source: decision 2026-09-25
    - note: "Seuls « Reçu » et « Received » sont acceptés. « Roger », le mot employé à l'antenne, est une réponse fausse, ni présente ni near."
      source: decision 2026-09-25
    - lang: de
      text: "Received"
      source: decision 2026-09-27
    - lang: de
      note: "Nur „Empfangen“ und „Received“ sind die erwarteten Formen. „Roger“, das Wort aus dem Funkverkehr, ist eine falsche Antwort, weder vorhanden noch near."
      source: decision 2026-09-27

459:
  0:
    - note: "Le nom de l'UIT exige le mot « internationale » : « l'Union des télécoms » ou « l'Union des télécommunications » n'est pas son nom, c'est une réponse fausse, ni présente ni near. Le sigle UIT seul est juste."
      source: decision 2026-09-25
    - lang: de
      text: "ITU (Internationale Fernmeldeunion)"
      source: decision 2026-09-27
    - lang: de
      note: "Der deutsche Katalog gibt den englischen Namen; der deutsche, „Internationale Fernmeldeunion“, ist ebenso richtig, und die Abkürzung ITU allein auch. Der Name verlangt „international“: „die Fernmeldeunion“ allein ist nicht ihr Name, eine falsche Antwort, weder vorhanden noch near."
      source: decision 2026-09-27

