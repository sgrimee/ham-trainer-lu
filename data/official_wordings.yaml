# Other official wordings of open-question answers (specs/LEARN-2-3.md §1.3, §4.5).
#
# The ILR marks against its catalogue and its guide. Where the guide words an
# answer differently from the catalogue, or states a fact the catalogue's answer
# leaves out, the LLM grader is given the guide's wording alongside the
# catalogue's reference, so that it neither rejects nor contradicts the guide.
#
# question id -> sub-item (the catalogue's item_no; 0 for a single answer) ->
# wordings, verbatim from the guide: the lines of a list, or the sentences of
# one section, may be joined, and a certificate's name may head its sentence.
# `source` is the guide page, as `ilr-guide-2023 p.N §x`, or, for a form the
# project owner decided to accept or refuse, `decision YYYY-MM-DD`.
#
# An entry is French unless it has `lang: de`. The guide is French only, so a
# German entry is always a decision, about a German reference answer that is
# wrong or incomplete (specs/LEARN-DE.md §3.1); a German answer is graded
# against the German reference and the `de` entries alone.
#
# An entry may be a `note` instead of a `text`: a fact from the guide the grader
# must apply, such as a neighbouring code's meaning that is a wrong answer here.
#
# Only differences belong here: a wording the catalogue already has adds
# nothing. tests/test_official_wordings.py checks every entry against the
# catalogue. Spelling (440-446) is graded by app/spelling.py and needs none.

