469:
  0:
    - note: "La question demande 6 sujets et la référence en liste 10 : six sujets valides de la liste forment une réponse complète. Construis 6 éléments ; les autres sujets de la référence ne manquent pas."
      source: decision 2026-09-25
    - lang: de
      note: "Die Frage verlangt 6 Themen und die Referenz nennt 10: sechs gültige Themen der Liste sind eine vollständige Antwort. Bilde 6 Elemente; die anderen Themen der Referenz fehlen nicht. Die Referenz ist holprig übersetzt: „Vereinsleben“ oder „Clubleben“ ist „Amateur-assoziatives Leben“, „Amateurfunkvorschriften“ ist „Amateur-Regulierung“, und eine Einweisung per Funk ist „Funkführung“; alle sind vorhanden und nicht near."
      source: decision 2026-09-27

