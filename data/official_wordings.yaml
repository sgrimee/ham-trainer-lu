    - text: "Le certificat de BASE limite le niveau de la puissance radioélectrique à 25W PEP à la sortie de l'émetteur. Le certificat NOVICE limite le niveau de la puissance à 100 W PEP à la sortie de l'émetteur. HAREC : la puissance à la sortie de l'émetteur est limitée à 100 W PEP dans l'année qui suit l'obtention du certificat HAREC. Par après, la puissance est limitée à 1000 W PEP."
