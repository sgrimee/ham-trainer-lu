# Reference material published by the ILR (Institut Luxembourgeois de Régulation).
#
# Two sections:
#   documents — downloadable files, fetched into reference/ by `mise run download-refs`.
#   links     — web pages kept for reference only. Never downloaded.
#
# In `documents`, `filename` is load-bearing: it is the exact name on disk that the
# rest of the pipeline expects (e.g. specs/EXTRACTION.md references the catalogue by this
# name). Do not rename it to match a changed URL — add a new entry instead.
#
# `sha256` pins the exact bytes. The extractor is positional and validated against
# one specific file, and the ILR re-uploads under the same URL, so a download
# that does not match is rejected rather than silently changing data/. When the
# ILR publishes a new version on purpose, re-extract and update the hash.
#
# `id` is equally load-bearing in the other direction: data/annotations.jsonl points
# at documents by id, so a question's reference survives a moved URL or a renamed
# file (specs/TRAINER.md §10). Ids are permanent — never reuse or repurpose one.

