# mise owns the toolchain, the environment and the task runner.
# uv owns Python dependencies (pyproject.toml + uv.lock). One owner each.

[tools]
python = "3.13"
uv = "latest"
yq = "latest"        # scripts/download-refs.sh

[env]
# Autoloaded on entering the directory. The file is gitignored and absent on a
# fresh clone, which mise tolerates silently -- see .env.example for the keys.
_.file = ".env"

[tasks.setup]
description = "Install Python dependencies into .venv"
run = "uv sync"

[tasks.extract]
description = "PDF -> data/questions.jsonl + data/assets/"
depends = ["download-refs"]
run = "uv run python extract/run.py"
sources = ["reference/*.pdf", "extract/*.py"]
outputs = ["data/questions.jsonl"]

[tasks.appendix]
description = "PDF -> data/appendix/ (exam-day formula sheet)"
depends = ["download-refs"]
run = "uv run python extract/appendix.py"

[tasks.verify]
description = "Run every validation gate: the extraction round trip, then the curated annotations"
depends = ["download-refs"]   # validate.py re-reads the catalogue PDF
run = [
  "uv run python extract/validate.py",
  "uv run python -m app.annotations",
]

[tasks.data]
description = "Rebuild data/ from the source PDFs and check it"
depends = ["extract", "appendix"]
run = "mise run verify"

[tasks.download-refs]
description = "Download reference PDFs listed in reference/documents.yaml (skips files already present)"
run = "./scripts/download-refs.sh"

[tasks.docker-build]
description = "Build the container image (Dockerfile); the reference PDFs it copies are downloaded first"
depends = ["download-refs"]
run = "docker build -t examen-ilr ."

[tasks.serve-docker]
description = "Build and run the container image at http://127.0.0.1:8000"
depends = ["docker-build"]
# The LLM_* names come from the environment mise loaded from .env (bare -e passes
# them through when set). Attempts persist in the examen-ilr-data named volume.
run = """
docker run --rm -p 8000:8000 \
  -e LLM_BASE_URL -e LLM_API_KEY -e LLM_MODEL \
  -v examen-ilr-data:/var/lib/examen \
  examen-ilr
"""

[tasks.eval-grader]
description = "Score models against the golden grading cases -- run after any grader-prompt change"
# Extra arguments are appended: `mise run eval-grader --runs 2 openai/gpt-5.1 <other>`.
# With none, it scores $LLM_MODEL. Needs LLM_API_KEY and spends a few cents per model.
run = "uv run python tests/eval_grader.py"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Ruff lint + ty type check"
run = [
  "uv run ruff check .",
  "uv run ty check .",
]

[tasks.serve]
description = "Run the training application (specs/TRAINER.md §3)"
depends = ["download-refs"]   # the app serves reference/<filename> for question-to-guide links
run = "uv run uvicorn app.main:app --reload"
