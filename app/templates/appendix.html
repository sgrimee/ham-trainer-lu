<!doctype html>
<html lang="{{ ui }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="appendix-page">
<h1>{{ title }}</h1>
{% for page in pages %}

{% endfor %}
<footer class="footer">
  <a href="{{ report_issue_url(request) }}" target="_blank" rel="noopener">{{ t(ui, 'report_problem') }}</a>
</footer>
</body>
</html>
