<!doctype html>
<html lang="{{ ui }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t(ui, 'app_title') }}{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">{{ t(ui, 'app_title') }}</a>
  <nav>
    <a href="/appendix?lang={{ ui }}" target="_blank" rel="noopener">{{ t(ui, 'appendix') }}</a>
    {% if not grader_available %}
      <span class="model-badge model-badge--none">{{ t(ui, 'no_model_configured') }}</span>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <a href="{{ report_issue_url(request, q=q|default(none), attempt=attempt|default(none), n=n|default(none)) }}"
     target="_blank" rel="noopener">{{ t(ui, 'report_problem') }}</a>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
