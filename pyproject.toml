[project]
name = "examen-ilr"
version = "0.1.0"
description = "Training application for the ILR radioamateur exam (BASE / NOVICE / HAREC)"
requires-python = ">=3.13"

# Runtime dependencies: what ships in the container. The extraction pipeline is
# deliberately absent here -- see the `extract` group.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "httpx2>=2.13",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
# The PDF pipeline. Needed to rebuild data/, never to serve it, so the container
# image is built with `--no-group extract` and carries no PDF toolchain at all.
extract = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.uv]
default-groups = ["extract", "dev"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom: `param: X = Depends(...)` calls Depends() in the default.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ty.environment]
python-version = "3.13"
